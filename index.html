<style>
/* Mr Benefit brand: navy #021f40 + electric blue #0bacfe + white */
:root{--navy:#021f40;--navy-2:#0a2e57;--navy-3:#123a68;--blue:#0bacfe;--blue-ink:#0077c2;
--bg:#f2f6fb;--surface:#fff;--ink:#0d1b2e;--muted:#5b6b80;--line:#dde5ef;--row:#f7fafd;
--red:#d93f3f;--amber:#c27c0e;--green:#1f9d63;
--display:"Montserrat",system-ui,sans-serif;--body:"Manrope",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#06162b;--surface:#0b2240;--ink:#e8f0fa;--muted:#94a7bf;--line:#1d3a5f;--row:#0e2848;--blue-ink:#4cc3ff;--red:#ff7a7a;--amber:#f0b44c;--green:#4fd39a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--body)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* login */
.login-wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(circle at 50% 0%,var(--navy-3),var(--navy) 60%)}
.login{width:min(380px,100%);background:#fff;color:#0d1b2e;border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgb(0 0 0/.35)}
.login img{width:96px;height:96px;align-self:center}
.login h2{margin:0;text-align:center;font:800 20px var(--display);color:#021f40}
.login p{margin:-8px 0 4px;text-align:center;color:#5b6b80;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.login input{background:#f2f6fb;border-color:#dde5ef;color:#0d1b2e}

/* shell */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100%}
.side{background:var(--navy);color:#cfe0f5;display:flex;flex-direction:column;gap:6px;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 16px;border-bottom:1px solid var(--navy-3);margin-bottom:8px}
.brand img{width:46px;height:46px}
.brand b{display:block;font:800 17px var(--display);color:#fff;letter-spacing:.01em}
.brand b span{color:var(--blue)}
.brand small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7fa3c9}
.sec{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6f8fb3;padding:12px 8px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:#cfe0f5;cursor:pointer;font-weight:600}
.nav:hover{background:var(--navy-2)}
.nav[aria-current="page"]{background:var(--navy-3);color:#fff;box-shadow:inset 3px 0 0 var(--blue)}
.nav .sw{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.nav .n{margin-left:auto;font:500 11.5px var(--mono);color:#7fa3c9}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--navy-3);display:flex;flex-direction:column;gap:8px}
.side-foot .who{font-size:12px;color:#7fa3c9;overflow-wrap:anywhere;padding:0 8px}
.main{padding:24px clamp(16px,3vw,36px) 48px;min-width:0;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font:800 clamp(20px,2.6vw,26px)/1.2 var(--display);color:var(--ink)}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.btn{border:0;background:var(--blue);color:#021f40;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.side-btn{background:var(--navy-2);color:#cfe0f5;border:1px solid var(--navy-3);font-weight:600}
.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red)}
.notice{background:var(--surface);border:1px solid var(--red);color:var(--red);padding:10px 12px;border-radius:8px}

/* home tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.tile:hover{border-color:var(--blue)}
.tile h3{margin:0;font:700 17px/1.25 var(--display)}
.tile .stats{display:flex;gap:18px}
.tile .stats div{display:flex;flex-direction:column}
.tile .stats b{font:600 22px var(--mono);font-variant-numeric:tabular-nums}
.tile .stats small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tile .stats .bad b{color:var(--red)}
.tile .go{color:var(--blue-ink);font-weight:700;font-size:13px}

/* company */
.info{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:120px repeat(2,minmax(0,1fr));gap:12px}
.info .note{grid-column:1/-1}
@media (max-width:760px){.info{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink);font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;width:100%}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;width:max-content;max-width:100%;overflow:auto}
.tab{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--navy);color:#fff}
.tab .n{font:500 11px var(--mono);margin-left:4px;opacity:.8}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
thead th{background:var(--navy);color:#dbe8f7;font-size:11px;text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:10px 12px;font-weight:700}
tbody td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even){background:var(--row)}
tbody tr:hover{background:color-mix(in srgb,var(--blue) 8%,transparent)}
td.t{font-weight:700;min-width:220px}
td.note{color:var(--muted);font-size:13px;max-width:320px}
.due{font:500 13px var(--mono);white-space:nowrap}.due.over{color:var(--red)}.due.soon{color:var(--amber)}
.svc{display:inline-block;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue-ink);padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.freq{color:var(--muted);font-size:13px;white-space:nowrap}
select.st{width:auto;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;border:1px solid transparent}
select.st[data-v="todo"]{background:color-mix(in srgb,var(--muted) 15%,transparent)}
select.st[data-v="doing"]{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue-ink)}
select.st[data-v="waiting"]{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
select.st[data-v="done"]{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.icon{background:none;border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer;color:var(--ink);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* view switch: Vazifalar | Buyruqlar */
.views{display:flex;gap:0;border-bottom:2px solid var(--line)}
.vbtn{border:0;background:none;padding:10px 18px;margin-bottom:-2px;border-bottom:3px solid transparent;cursor:pointer;font:700 14.5px var(--display);color:var(--muted)}
.vbtn[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.vbtn .n{font:500 11.5px var(--mono);margin-left:6px;opacity:.75}
.pane{display:flex;flex-direction:column;gap:14px}

/* commands */
.cmds{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
@media (max-width:420px){.cmds{grid-template-columns:1fr}}
.cmd{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.cmd-h{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 10px}
.cmd-h .ix{flex:none;width:30px;height:30px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 13px var(--mono)}
.cmd-h h3{margin:3px 0 0;font:700 16px/1.3 var(--display)}
.cmd ol{margin:0 0 14px;padding:0 16px 0 46px;display:flex;flex-direction:column;gap:6px;counter-reset:s;list-style:none}
.cmd ol li{position:relative;line-height:1.45;overflow-wrap:anywhere}
.cmd ol li::before{counter-increment:s;content:counter(s);position:absolute;left:-30px;top:1px;width:20px;height:20px;border-radius:50%;background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue-ink);font:700 11px var(--mono);display:grid;place-items:center}
.cmd .cnote{margin:0 16px 14px;padding:8px 10px;border-left:3px solid var(--amber);background:color-mix(in srgb,var(--amber) 9%,transparent);font-size:13px;color:var(--ink);border-radius:0 6px 6px 0;white-space:pre-wrap}
.cmd-f{display:flex;gap:8px;padding:14px 16px;margin-top:auto;border-top:1px solid var(--line)}
.cmd-f .btn{padding:7px 14px;font-size:13px}
.cmd-f .icon{margin-left:auto}
.btn.ok{background:var(--green);color:#fff}
.setup{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.setup b{color:var(--ink)}

/* modal */
.modal{position:fixed;inset:0;background:rgb(2 31 64/.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.panel{background:var(--surface);border-radius:14px;padding:20px;width:min(540px,100%);display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto;border-top:5px solid var(--blue)}
.panel h3{margin:0;font:800 18px var(--display)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:480px){.row2{grid-template-columns:1fr}}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}.actions div{display:flex;gap:8px}

/* mobile */
.mbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:30;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgb(2 31 64/.5)}
  .mbar{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:10}
  .mbar img{width:34px;height:34px}.mbar b{font:800 15px var(--display)}.mbar b span{color:var(--blue)}
  .mbar button{margin-left:auto;background:var(--navy-2);border:1px solid var(--navy-3);color:#fff;border-radius:8px;padding:6px 12px;font-weight:700}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>

<script>
const SUPABASE_URL='https://ghexjgkqqkwerhiupcaj.supabase.co';
const SUPABASE_KEY='sb_publishable_GpZ-XbyPLgLZqNnU8M380Q_0DkFrPTX';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const STATUSES=[{k:'todo',l:'Rejada'},{k:'doing',l:'Jarayonda'},{k:'waiting',l:'Mijozdan kutilmoqda'},{k:'done',l:'Bajarildi'}];
const SERVICES=['Driver settlement','Bookkeeping','Payroll','Invoicing / Factoring','IFTA','Form 941','Form 2290','IRP','UCR','1099','Soliq hisobotlari','Boshqa'];
const FREQS=[{k:'once',l:'Bir martalik'},{k:'weekly',l:'Har hafta'},{k:'biweekly',l:'Har 2 hafta'},{k:'monthly',l:'Har oy'},{k:'quarterly',l:'Har chorak'},{k:'yearly',l:'Har yil'}];
let companies=[],tasks=[],current=null,filter='open',editing=null;
let commands=[],cmdsMissing=false,view='tasks',cmdEditing=null;
try{const v=localStorage.getItem('mb_view');if(v==='cmds'||v==='tasks')view=v}catch{}
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=iso(new Date());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=s=>s?parse(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):'—';
const daysTo=s=>Math.round((parse(s)-parse(today))/864e5);
function nextDue(s,f){const d=parse(s||today);
  if(f==='weekly')d.setDate(d.getDate()+7);else if(f==='biweekly')d.setDate(d.getDate()+14);else if(f==='monthly')d.setMonth(d.getMonth()+1);
  else if(f==='quarterly')d.setMonth(d.getMonth()+3);else if(f==='yearly')d.setFullYear(d.getFullYear()+1);else return null;return iso(d)}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
const co=id=>companies.find(c=>c.id===id)||{name:id,color:'#0bacfe'};
const open=t=>t.status!=='done';
function fill(el,items){el.innerHTML=items.map(i=>typeof i==='string'?`<option>${esc(i)}</option>`:`<option value="${esc(i.k)}">${esc(i.l)}</option>`).join('')}
fill($('#f-service'),SERVICES);fill($('#f-freq'),FREQS);fill($('#f-status'),STATUSES);
function notice(m){const n=$('#notice');n.textContent=m;n.hidden=false;setTimeout(()=>n.hidden=true,7000)}

async function load(){
  const [c,t]=await Promise.all([sb.from('companies').select('*').order('sort_order'),sb.from('tasks').select('*')]);
  if(c.error||t.error){notice("Ma'lumot yuklanmadi: "+(c.error||t.error).message);return}
  companies=c.data;tasks=t.data;
  const k=await sb.from('commands').select('*').order('sort_order');
  if(k.error){commands=[];cmdsMissing=true}else{commands=k.data;cmdsMissing=false}
  render();
}
const steps=c=>(c.steps||'').split('\n').map(s=>s.trim()).filter(Boolean);
function cmdText(c){const s=steps(c);
  return `${co(c.company_id).name} — ${c.title}\nHafta: ____\n\nQadamlar:\n${s.map((x,i)=>`${i+1}. ${x}`).join('\n')}${c.note?`\n\nEslatma: ${c.note}`:''}`}
function renderCmds(list){
  if(cmdsMissing){$('#cmds').innerHTML=`<div class="setup"><b>Buyruqlar jadvali hali yaratilmagan.</b>Supabase → SQL Editor'da <code>commands</code> jadvali uchun SQL'ni bir marta ishga tushiring, keyin sahifani yangilang.</div>`;return}
  $('#cmds').innerHTML=list.length?list.map((c,i)=>`<article class="cmd">
    <div class="cmd-h"><span class="ix">${pad(i+1)}</span><h3>${esc(c.title)}</h3></div>
    ${steps(c).length?`<ol>${steps(c).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}
    ${c.note?`<div class="cnote">${esc(c.note)}</div>`:''}
    <div class="cmd-f"><button class="btn" type="button" data-copy="${c.id}">Nusxa olish</button><button class="icon" type="button" data-cedit="${c.id}">Tahrir</button></div>
  </article>`).join(''):`<div class="setup"><b>Bu kompaniyada hali buyruq yo'q.</b>"+ Yangi buyruq" tugmasi bilan qo'shing: masalan, All Loads yoki Statementlar tayyorlash.</div>`}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch{
  const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();
  let ok=false;try{ok=document.execCommand('copy')}catch{}a.remove();return ok}}
function stats(id){const l=tasks.filter(t=>t.company_id===id&&open(t));return{open:l.length,over:l.filter(t=>t.due&&daysTo(t.due)<0).length}}
function render(){
  const h=decodeURIComponent(location.hash.slice(1));current=h&&companies.some(c=>c.id===h)?h:null;
  $('#coNav').innerHTML=companies.map(c=>`<button class="nav" type="button" data-go="${esc(c.id)}" style="--c:${esc(c.color||'#0bacfe')}" ${current===c.id?'aria-current="page"':''}><span class="sw"></span>${esc(c.name)}</button>`).join('');
  $('.nav[data-go=""]').setAttribute('aria-current',current?'false':'page');
  $('#homeView').hidden=!!current;$('#coView').hidden=!current;
  if(!current){
    $('#tiles').innerHTML=companies.length?companies.map(c=>{return `<button class="tile" type="button" data-go="${esc(c.id)}" style="--c:${esc(c.color||'#0bacfe')}">
      <h3>${esc(c.name)}</h3><div class="stats"><div><b>${c.trucks??'—'}</b><small>Active trucks</small></div></div>
      <span class="go">Ochish →</span></button>`}).join(''):'<div class="empty">Hali kompaniya yo\'q.</div>';
    return}
  const c=co(current),all=tasks.filter(t=>t.company_id===current);
  $('#coName').textContent=c.name;$('#coSub').textContent=`${c.trucks??'—'} active trucks`;
  const ae=document.activeElement;if(!(ae&&ae.closest&&ae.closest('#info')))
  $('#info').innerHTML=`<label>Active trucks<input type="number" min="0" data-k="trucks" value="${c.trucks??''}"></label>
    <label>Google akkaunt<input data-k="google" value="${esc(c.google||'')}"></label>
    <label>Telegram<input data-k="telegram" value="${esc(c.telegram||'')}"></label>
    <label class="note">Izoh<textarea rows="2" data-k="note">${esc(c.note||'')}</textarea></label>`;
  const cl=commands.filter(x=>x.company_id===current);
  $('#views').innerHTML=[['tasks','Vazifalar',all.filter(open).length],['cmds','Buyruqlar',cl.length]].map(([k,l,n])=>`<button class="vbtn" role="tab" type="button" data-view="${k}" aria-selected="${view===k}">${l}<span class="n">${n}</span></button>`).join('');
  $('#tasksPane').hidden=view!=='tasks';$('#cmdPane').hidden=view!=='cmds';
  $('#addBtn').textContent=view==='cmds'?'+ Yangi buyruq':'+ Yangi vazifa';$('#addBtn').hidden=view==='cmds'&&cmdsMissing;
  if(view==='cmds'){renderCmds(cl);return}
  const counts={open:all.filter(open).length,done:all.length-all.filter(open).length,all:all.length};
  $('#tabs').innerHTML=[['open','Ochiq'],['done','Bajarildi'],['all','Hammasi']].map(([k,l])=>`<button class="tab" role="tab" type="button" data-f="${k}" aria-selected="${filter===k}">${l}<span class="n">${counts[k]}</span></button>`).join('');
  let list=all.filter(t=>filter==='all'||(filter==='open'?open(t):!open(t)));
  list.sort((a,b)=>filter==='done'?((b.done_at||'')>(a.done_at||'')?1:-1):((a.due||'9')<(b.due||'9')?-1:1));
  $('#rows').innerHTML=list.length?list.map(row).join(''):`<tr><td colspan="7" class="empty">${filter==='done'?'Hali bajarilgan vazifa yo\'q':'Ochiq vazifa yo\'q'}</td></tr>`;
}
function row(t){let dc='';if(t.due&&open(t)){const d=daysTo(t.due);dc=d<0?'over':d<=3?'soon':''}
  const f=FREQS.find(x=>x.k===t.freq);
  return `<tr><td class="t">${esc(t.title)}</td><td><span class="svc">${esc(t.service||'—')}</span></td>
    <td><span class="due ${dc}">${dc==='over'?'Kechikdi · ':''}${fmt(t.due)}</span></td><td class="freq">${f?f.l:''}</td>
    <td><select class="st" data-st="${t.id}" data-v="${t.status}" aria-label="Holat">${STATUSES.map(s=>`<option value="${s.k}" ${s.k===t.status?'selected':''}>${s.l}</option>`).join('')}</select></td>
    <td class="note">${esc(t.note||'')}</td><td><button class="icon" type="button" data-edit="${t.id}">Tahrir</button></td></tr>`}

async function setStatus(id,status){const t=tasks.find(x=>x.id===id);if(!t||t.status===status)return;
  const {error}=await sb.from('tasks').update({status,done_at:status==='done'?today:null}).eq('id',id);
  if(error)return notice('Saqlanmadi: '+error.message);
  if(status==='done'&&t.freq&&t.freq!=='once'){await sb.from('tasks').insert({company_id:t.company_id,title:t.title,service:t.service,freq:t.freq,due:nextDue(t.due,t.freq),status:'todo',note:t.note})}
  load()}

document.addEventListener('change',async e=>{
  const s=e.target.closest('[data-st]');if(s)return setStatus(s.dataset.st,s.value);
  const a=e.target.closest('#info [data-k]');if(a&&current){const k=a.dataset.k;const v=k==='trucks'?(a.value===''?null:Number(a.value)):a.value;
    const {error}=await sb.from('companies').update({[k]:v}).eq('id',current);if(error)notice('Saqlanmadi: '+error.message);else{co(current)[k]=v;render()}}
});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;$('#side').classList.remove('open');return}
  const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;render();return}
  const ed=e.target.closest('[data-edit]');if(ed)openForm(tasks.find(t=>t.id===ed.dataset.edit));
  const v=e.target.closest('[data-view]');if(v){view=v.dataset.view;try{localStorage.setItem('mb_view',view)}catch{}render();return}
  const cp=e.target.closest('[data-copy]');if(cp){const c=commands.find(x=>String(x.id)===cp.dataset.copy);if(!c)return;
    copyText(cmdText(c)).then(ok=>{cp.textContent=ok?'Nusxalandi ✓':'Nusxa olinmadi';cp.classList.toggle('ok',ok);setTimeout(()=>{cp.textContent='Nusxa olish';cp.classList.remove('ok')},1800)});return}
  const ce=e.target.closest('[data-cedit]');if(ce)openCmd(commands.find(x=>String(x.id)===ce.dataset.cedit));
});
function openCmd(c){cmdEditing=c||null;
  $('#cmdFormTitle').textContent=c?'Buyruqni tahrirlash':'Yangi buyruq';
  $('#c-title').value=c?.title||'';$('#c-steps').value=c?.steps||'';$('#c-note').value=c?.note||'';
  $('#c-order').value=c?.sort_order??(commands.filter(x=>x.company_id===current).length+1);
  const d=$('#cmdDelBtn');d.hidden=!c;d.textContent="O'chirish";d.dataset.armed='';$('#cmdModal').hidden=false;$('#c-title').focus()}
function closeCmd(){$('#cmdModal').hidden=true;cmdEditing=null}
$('#cmdCancelBtn').onclick=closeCmd;$('#cmdModal').addEventListener('click',e=>{if(e.target.id==='cmdModal')closeCmd()});
$('#cmdDelBtn').onclick=async()=>{const b=$('#cmdDelBtn');if(!b.dataset.armed){b.dataset.armed='1';b.textContent="Ha, o'chirilsin";return}
  const {error}=await sb.from('commands').delete().eq('id',cmdEditing.id);if(error)return notice(error.message);closeCmd();load()};
$('#cmdForm').addEventListener('submit',async e=>{e.preventDefault();
  const d={title:$('#c-title').value.trim(),steps:$('#c-steps').value.trim(),note:$('#c-note').value.trim(),sort_order:Number($('#c-order').value)||0};
  if(!d.title)return;const r=cmdEditing?await sb.from('commands').update(d).eq('id',cmdEditing.id):await sb.from('commands').insert({...d,company_id:current});
  if(r.error)return notice('Saqlanmadi: '+r.error.message);closeCmd();load()});
window.addEventListener('hashchange',()=>{filter='open';render();window.scrollTo(0,0)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeForm();closeCmd();$('#side').classList.remove('open')}});
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');

function openForm(t){editing=t||null;fill($('#f-company'),companies.map(c=>({k:c.id,l:c.name})));
  $('#formTitle').textContent=t?'Vazifani tahrirlash':'Yangi vazifa';
  $('#f-title').value=t?.title||'';$('#f-company').value=t?.company_id||current||companies[0]?.id||'';$('#f-service').value=t?.service||'Driver settlement';
  $('#f-freq').value=t?.freq||'once';$('#f-due').value=t?.due||today;$('#f-status').value=t?.status||'todo';$('#f-note').value=t?.note||'';
  const d=$('#delBtn');d.hidden=!t;d.textContent="O'chirish";d.dataset.armed='';$('#modal').hidden=false;$('#f-title').focus()}
function closeForm(){$('#modal').hidden=true;editing=null}
$('#cancelBtn').onclick=closeForm;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeForm()});
$('#addBtn').onclick=()=>view==='cmds'?openCmd(null):openForm(null);
$('#delBtn').onclick=async()=>{const b=$('#delBtn');if(!b.dataset.armed){b.dataset.armed='1';b.textContent="Ha, o'chirilsin";return}
  const {error}=await sb.from('tasks').delete().eq('id',editing.id);if(error)return notice(error.message);closeForm();load()};
$('#form').addEventListener('submit',async e=>{e.preventDefault();
  const d={title:$('#f-title').value.trim(),company_id:$('#f-company').value,service:$('#f-service').value,freq:$('#f-freq').value,due:$('#f-due').value||null,status:$('#f-status').value,note:$('#f-note').value.trim()};
  if(!d.title)return;const r=editing?await sb.from('tasks').update(d).eq('id',editing.id):await sb.from('tasks').insert(d);
  if(r.error)return notice('Saqlanmadi: '+r.error.message);closeForm();load()});

$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginErr').textContent='';$('#loginBtn').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});
  $('#loginBtn').disabled=false;if(error)$('#loginErr').textContent="Email yoki parol noto'g'ri."});
$('#logoutBtn').onclick=()=>sb.auth.signOut();
sb.auth.onAuthStateChange((_ev,session)=>{const on=!!session;$('#loginView').hidden=on;$('#appView').hidden=!on;
  if(on){$('#who').textContent=session.user.email;load()}else{companies=[];tasks=[];commands=[];$('#tiles').innerHTML='';$('#rows').innerHTML='';$('#coNav').innerHTML=''}});
</script>
</body>
</html>
